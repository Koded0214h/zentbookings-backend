services:
  api:
    image: zentbookings-backend:latest
    container_name: zent-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "1"
    ports:
      - "127.0.0.1:8004:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

